name: daily snapshot

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC, todo dia
  workflow_dispatch: {}     # permite rodar manualmente

permissions:
  contents: write           # pra commitar history.csv + report.html de volta

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Clone decoder (sibling público)
        run: git clone --depth 1 https://github.com/Vdto88/alkanes-opreturn-decoder.git ../opreturn-decoder

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Daily snapshot
        env:
          SUBFROST_KEY: ${{ secrets.SUBFROST_KEY }}
        run: npx tsx tools/snapshot.ts --blocks 144 --sample 6 --concurrency 16

      - name: Build report
        run: npx tsx tools/build-report.ts

      - name: Commit history + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv report.html
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
          git push
