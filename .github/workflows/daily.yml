name: daily snapshot

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC, todo dia
  workflow_dispatch: {}     # permite rodar manualmente

permissions:
  contents: write           # pra commitar history.csv + report.html de volta

# Fonte esplora usada pelos dois passos de varredura.
#
# Volta pra `subfrost` (gateway mainnet.subfrost.io/v4/<key>). A chave de
# servico existe e e literalmente `subfrost`: o secret SUBFROST_KEY guardava a
# assinatura PESSOAL que venceu, e o gateway passou a responder "Invalid or
# inactive API key" a partir de 2026-07-21 08:42 UTC (ultima chamada boa
# 07-20 09:32). Os 4 metodos que o scanner usa foram testados contra a chave
# nova antes deste commit -- esplora_blocks:tip:height, esplora_block-height:<h>,
# esplora_block:<hash> e esplora_block:<hash>:txs:<i> -- e o ultimo devolve o
# campo `fee`, que e justamente o que o censo metashrew nao produz.
#
# O `mempool` foi o stopgap dos dois dias congelados e NAO serve pra varredura
# sustentada. Medido na run 29948501062 (o unico ciclo completo que rodou nele):
# 207 dos 216 blocos do censo denso falharam com `TypeError: fetch failed`, o
# workflow ficou VERDE porque scanRange pula bloco falho e continua o range, e
# o history.csv foi publicado com 2026-07-21 valendo 9 blocos de um dia que
# teve 138. Ele aguenta spot-check de poucos blocos; nao aguenta um censo.
#
# Antes de confiar num check verde deste pipeline, rode o gateway-healthcheck:
# ele assere sobre a linha `Cobertura: ... (N blocos)`, nao sobre o exit code.
env:
  SCAN_SOURCE: subfrost

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Clone decoder (sibling público)
        run: git clone --depth 1 https://github.com/Vdto88/alkanes-opreturn-decoder.git ../opreturn-decoder

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Daily snapshot
        env:
          SUBFROST_KEY: ${{ secrets.SUBFROST_KEY }}
        run: npx tsx tools/snapshot.ts --blocks 144 --sample 6 --concurrency 16 --source "$SCAN_SOURCE"

      # Censo diário: varre TODO bloco recente (sample 1) e re-agrega por timestamp
      # real via seed-history --merge — o dia de ontem vira censo já nesta manhã,
      # sem esperar o backfill manual. A janela (últimos ~216 blocos = fromHeight
      # do snapshot - 72) cobre ontem inteiro com margem; sobreposição com dias já
      # censados é idempotente. continue-on-error: um denso falho não pode derrubar
      # o snapshot amostrado que já está no history.csv.
      - name: Daily census (dense pass, yesterday becomes census)
        continue-on-error: true
        env:
          SUBFROST_KEY: ${{ secrets.SUBFROST_KEY }}
        run: |
          ROW=$(tail -1 history.csv)
          FROM=$(( $(echo "$ROW" | cut -d, -f2) - 72 ))
          TO=$(echo "$ROW" | cut -d, -f3)
          echo "census: blocos $FROM..$TO (sample 1, fonte $SCAN_SOURCE)"
          npx tsx src/cli.ts --from "$FROM" --to "$TO" --sample 1 --concurrency 20 --source "$SCAN_SOURCE"
          npx tsx tools/seed-history.ts cache history.csv --merge

      # Enriquecimento (weight/UG/runestone) do arquivo lateral do indexer (censo full-block),
      # commitado no repo. Idempotente; preenche as colunas que o scan de OP_RETURN não produz.
      # Sem isto o enriquecimento reatrasa toda vez que o censo cria/reescreve linhas recentes.
      - name: Merge enrichment columns (weight/UG/runestone)
        run: |
          npx tsx tools/merge-blockspace.ts history.csv blockspace-daily.json
          npx tsx tools/backfill-runestone-cols.ts history.csv blockspace-daily.json

      - name: Build report
        run: npx tsx tools/build-report.ts

      - name: Stage Pages content
        run: |
          mkdir -p public
          cp report.html public/index.html
          cp history.csv public/history.csv
          mkdir -p public/figures
          cp figures/gen-fig-13.py figures/README.md public/figures/
          cat > public/README.md <<'READMEEOF'
          # alkanes-opreturn-stats

          Live dashboard: **https://vdto88.github.io/alkanes-opreturn-stats/**
          The same charts, live on the site: **https://subfrost.io/metrics**

          Alkanes' share of Bitcoin OP_RETURN, updated daily. `history.csv` holds one
          row per day. Built by the open-source (MIT) `alkanes-opreturn-scanner`, which
          reuses `alkanes-opreturn-decoder` to classify each transaction
          (protocol_tag = 1). `figures/gen-fig-13.py` re-renders every article chart
          from `history.csv` (Python 3, stdlib only).
          READMEEOF

      - name: Publish to public Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: Vdto88/alkanes-opreturn-stats
          publish_branch: main
          publish_dir: ./public
          force_orphan: true

      - name: Commit history + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv report.html contracts-daily.json
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin master || true
          git push
